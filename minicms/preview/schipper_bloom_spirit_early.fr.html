true\">:</div>\n        <div class=\"bse-cd-unit\">\n          <div class=\"bse-cd-num\" data-bse-cd=\"hours\">--</div>\n          <div class=\"bse-cd-label\">Heures</div>\n        </div>\n        <div class=\"bse-cd-sep\" aria-hidden=\"true\">:</div>\n        <div class=\"bse-cd-unit\">\n          <div class=\"bse-cd-num\" data-bse-cd=\"minutes\">--</div>\n          <div class=\"bse-cd-label\">Minutes</div>\n        </div>\n        <div class=\"bse-cd-sep\" aria-hidden=\"true\">:</div>\n        <div class=\"bse-cd-unit\">\n          <div class=\"bse-cd-num\" data-bse-cd=\"seconds\">--</div>\n          <div class=\"bse-cd-label\">Secondes</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n    <section class=\"bse-signup\" data-bse-section=\"signup\">\n    <div class=\"bse-wrap\">\n      <div data-bse-form-view>\n        <h2 class=\"bse-signup-title\">Accédez-y en avant-première</h2>\n        <p class=\"bse-claim\">Strictement limité et dans la limite des stocks disponibles.</p>\n        <p class=\"bse-body\">Inscrivez-vous dès maintenant et soyez parmi les premiers à découvrir Bloom Spirit et à réserver l&#039;un des exemplaires limités.</p>\n\n                <form class=\"bse-form-row\" data-bse-form novalidate\n              data-bse-msg-firstname=\"Veuillez saisir votre prénom.\"\n              data-bse-msg-email=\"Veuillez saisir une adresse e-mail valide.\">\n          <input class=\"bse-pill-input\" data-bse-field=\"firstname\" type=\"text\" autocomplete=\"given-name\"\n                 placeholder=\"Votre prénom\" aria-label=\"Prénom\">\n          <input class=\"bse-pill-input\" data-bse-field=\"email\" type=\"email\" autocomplete=\"email\"\n                 placeholder=\"Votre adresse e-mail\" aria-label=\"Adresse e-mail\">\n          <button class=\"bse-btn\" type=\"submit\">S&#039;inscrire</button>\n        </form>\n\n        <p class=\"bse-error\" data-bse-error role=\"alert\" aria-live=\"polite\"></p>\n        <p class=\"bse-consent\">\n lass=\"bse-story-text\">\n          <h2>Le premier temps fort de la Schipper Exclusive Collection</h2>\n          <p>Certains motifs voient le jour – et l&#039;on sait immédiatement : celui-ci est particulier.</p>\n          <p>C&#039;est exactement ce que nous avons ressenti avec Bloom Spirit. Nous ne dévoilons pas encore tout, mais nous pouvons déjà vous dire ceci : Bloom Spirit est le premier motif de la Schipper Exclusive Collection – et ne sera disponible qu&#039;en 3 000 exemplaires.</p>\n          <p>Si vous souhaitez découvrir le nouveau motif avant tout le monde et tenter d&#039;obtenir l&#039;un des rares exemplaires, inscrivez-vous dès maintenant à l&#039;accès anticipé.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n    <section class=\"bse-limited\">\n    <div class=\"bse-limited-inner\">\n      <h2>Édition limitée</h2>\n      <p>Au sein de la Schipper Exclusive Collection en édition limitée, Bloom Spirit ne sera disponible qu&#039;en 3 000 exemplaires. Une fois l&#039;édition épuisée, le motif ne sera pas reproduit – et restera une pièce de collection particulière de la collection Schipper.</p>\n      <a class=\"bse-btn bse-btn-light\" href=\"#\" data-bse-scroll-to=\"signup\">Obtenir l&#039;accès anticipé</a>\n    </div>\n  </section>\n\n      <section class=\"bse-behind\">\n    <div class=\"bse-wrap\">\n      <h2>Un regard dans les coulisses</h2>\n      <div class=\"bse-video-ph\">\n        <div class=\"bse-video-play\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"></path></svg>\n        </div>\n        <span>Vidéo à venir</span>\n      </div>\n    </div>\n  </section>\n\n    <section class=\"bse-more\">\n    <div class=\"bse-more-inner\">\n      <div class=\"bse-more-copy\">\n        <h2>Découvrez plus de Schipper</h2>\n        <p><b>En attendant la révélation du motif, vous pouvez déjà flâner :</b> chez Schipper, vous trouverez de la peinture par numéros d'une qualité épro <script type="module">
/*
  Schipper – Bloom Spirit / Early Access
  --------------------------------------
  ES-Modul. Hängt nichts an `window`, greift nicht auf `document.body` zu und
  registriert keine Custom Elements. Sämtliche DOM-Zugriffe laufen über den
  übergebenen Wurzelknoten (ShadowRoot), damit mehrere Instanzen derselben
  Seite unabhängig voneinander laufen.

  TODO AGENTS.md: Einstiegskonvention prüfen. Angenommen wird, dass MiniCMS
  den Default-Export mit dem ShadowRoot (oder dem Host-Element) aufruft.
  Falls das Modul stattdessen z. B. ein benanntes `init` erwartet, ist nur
  der Export unten anzupassen – die Logik bleibt unverändert.
*/

const SELECTORS = {
  root: '[data-bse-root]',
  countdown: '[data-bse-countdown]',
  countdownField: '[data-bse-cd]',
  scrollTrigger: '[data-bse-scroll-to]',
  form: '[data-bse-form]',
  formView: '[data-bse-form-view]',
  successView: '[data-bse-success-view]',
  error: '[data-bse-error]',
};

const EMAIL_PATTERN = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

function pad(value) {
  return value < 10 ? `0${value}` : String(value);
}

function initCountdown(root) {
  const container = root.querySelector(SELECTORS.countdown);
  const host = root.querySelector(SELECTORS.root);
  if (!container || !host) return () => {};

  const target = Date.parse(host.dataset.bseTarget || '');
  if (Number.isNaN(target)) return () => {};

  const fields = {};
  container.querySelectorAll(SELECTORS.countdownField).forEach((el) => {
    fields[el.dataset.bseCd] = el;
  });

  let timer = null;

  const tick = () => {
    const diff = Math.max(0, target - Date.now());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    if (fields.days) fields.days.textContent = pad(days);
    if (fields.hours) fields.hours.textContent = pad(hours);
    if (fields.minutes) fields.minutes.textContent = pad(minutes);
    if (fields.seconds) fields.seconds.textContent = pad(seconds);

    if (diff === 0 && timer !== null) {
      clearInterval(timer);
      timer = null;
    }
  };

  tick();
  timer = setInterval(tick, 1000);

  return () => {
    if (timer !== null) clearInterval(timer);
    timer = null;
  };
}

function initScrollLinks(root) {
  const triggers = Array.from(root.querySelectorAll(SELECTORS.scrollTrigger));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const onClick = (event) => {
    const name = event.currentTarget.dataset.bseScrollTo;
    const target = root.querySelector(`[data-bse-section="${name}"]`);
    if (!target) return;
    event.preventDefault();
    target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  };

  triggers.forEach((el) => el.addEventListener('click', onClick));
  return () => triggers.forEach((el) => el.removeEventListener('click', onClick));
}

function initSignupForm(root) {
  const form = root.querySelector(SELECTORS.form);
  const formView = root.querySelector(SELECTORS.formView);
  const successView = root.querySelector(SELECTORS.successView);
  const errorBox = root.querySelector(SELECTORS.error);
  if (!form || !formView || !successView || !errorBox) return () => {};

  const firstnameField = form.querySelector('[data-bse-field="firstname"]');
  const emailField = form.querySelector('[data-bse-field="email"]');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const onSubmit = (event) => {
    event.preventDefault();

    const firstname = (firstnameField?.value || '').trim();
    const email = (emailField?.value || '').trim();

    if (!firstname) {
      errorBox.textContent = form.dataset.bseMsgFirstname || '';
      firstnameField?.focus();
      return;
    }
    if (!EMAIL_PATTERN.test(email)) {
      errorBox.textContent = form.dataset.bseMsgEmail || '';
      emailField?.focus();
      return;
    }

    errorBox.textContent = '';

    /*
      TODO D2S: Hier gehört die Übergabe an den ESP (Salesforce Marketing
      Cloud) über den vorgesehenen Interposer hin – Consent-gewrappt via
      Klaro. Aktuell verlässt bewusst KEIN Datensatz den Browser; die Seite
      darf in diesem Zustand nicht live gehen.
    */

    formView.hidden = true;
    successView.hidden = false;
    successView.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  };

  form.addEventListener('submit', onSubmit);
  return () => form.removeEventListener('submit', onSubmit);
}

/**
 * @param {ShadowRoot|HTMLElement} target ShadowRoot oder Host-Element der Instanz.
 * @returns {() => void} Aufräumfunktion (Timer und Listener der Instanz).
 */
export function init(target) {
  const root = target && target.shadowRoot ? target.shadowRoot : target;
  if (!root || typeof root.querySelector !== 'function') return () => {};

  const teardowns = [
    initCountdown(root),
    initScrollLinks(root),
    initSignupForm(root),
  ];

  return () => teardowns.forEach((fn) => fn());
}

export default init;


const payload = JSON.parse(document.getElementById('payload').textContent);

for (const id of ['instance-1', 'instance-2']) {
  const host = document.getElementById(id);
  const root = host.attachShadow({ mode: 'open' });
  const style = document.createElement('style');
  style.textContent = payload.css;
  root.appendChild(style);
  const wrapper = document.createElement('div');
  wrapper.innerHTML = payload.content;
  root.appendChild(wrapper);
  init(root);
}
</script>
